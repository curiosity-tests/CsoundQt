name: Build And Publish
on:
  push:
    branches:
    - csoundqt7

  workflow_dispatch:

env:
  PACKAGENAME: CsoundQt
  APPNAME: CsoundQt-d-cs7
  CSOUND_VERSION: 7

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

      # Version pins for Qt, csound, csound-plugins and the manual all live in
      # build-appimage.sh, so key all caches on its contents.
    - name: Cache Qt install
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: build-appimage/qt
        key: qt-${{ runner.os }}-${{ hashFiles('installers/Linux/build-appimage.sh') }}

    - name: Cache source checkouts and downloads
      uses: actions/cache@v4
      with:
        path: |
          build-appimage/src
          build-appimage/downloads
        key: src-${{ runner.os }}-${{ hashFiles('installers/Linux/build-appimage.sh') }}

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: build-appimage/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Build AppImage
      run: |
        ./installers/Linux/build-appimage.sh --install-deps

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: CsoundQt-Linux
        path: build-appimage/*.AppImage
        if-no-files-found: error

  publish:
    name: Publish Development Build pre-release
    needs:
    - appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Linux AppImage
      uses: actions/download-artifact@v4
      with:
        name: CsoundQt-Linux
        path: artifacts

    - name: Download macOS DMG
      uses: actions/download-artifact@v4
      with:
        name: CsoundQt-macOS
        path: artifacts

    - name: Download Windows installer
      uses: actions/download-artifact@v4
      with:
        name: CsoundQt-Windows
        path: artifacts

    - name: List artifacts
      run: |
        ls -lR artifacts

      # Replace any existing development prerelease (title starting with
      # "Development") with this build, reusing the "latest" tag, and upload
      # all installers (AppImage, DMG, Windows installers) as release assets.
    - name: Publish Development Build pre-release
      if: github.ref_name == 'csoundqt7' || github.ref_name == 'develop'
      env:
        GH_TOKEN: ${{ github.token }}
          # this job does not checkout the repository, so gh cannot discover
          # the repo from git; point it there explicitly (gh release create
          # and --generate-notes would otherwise fail with "not a git repository")
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        SHA="${{ github.sha }}"
        TAG="latest"

        # remove every previous prerelease whose title starts with "Development"
        gh api --paginate "repos/${REPO}/releases?per_page=100" \
          --jq '.[] | select(.prerelease == true and (.name | startswith("Development"))) | .id' \
          | while read -r id; do
              echo "Deleting previous development prerelease (release id ${id})"
              gh api -X DELETE "repos/${REPO}/releases/${id}"
            done

        # point the tag at this commit (create it if it does not exist yet)
        if gh api --method GET "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
          gh api --method PATCH "repos/${REPO}/git/refs/tags/${TAG}" \
            -f sha="${SHA}" \
            -F force=true
        else
          gh api --method POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${SHA}"
        fi

        # (re)create the prerelease on that tag and attach all installers
        gh release create "${TAG}" artifacts/* \
          --prerelease \
          --title "Development Build" \
          --generate-notes \
          --target "${SHA}"
        echo "Prerelease '${TAG}' published"
